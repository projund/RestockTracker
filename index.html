<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conroe Restock Tracker</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">Conroe <span>Restock</span></div><nav id="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="products">Products</button><button data-view="stores">Stores</button><button data-view="calendar">Calendar</button><button data-view="mapview">Map</button><button data-view="watchlist">Watchlist</button><button data-view="history">History</button><button data-view="settings">Data</button></nav></aside><div id="navBackdrop" class="nav-backdrop"></div><main><header class="topbar"><div><h1 id="pageTitle">Dashboard</h1><div class="muted">Walmart + Target · 40 miles from 77304</div></div><button id="mobileMenuBtn" class="icon-btn mobile-menu-btn" aria-label="Open menu" aria-expanded="false">☰</button><div class="actions top-actions"><button class="btn" id="addProductBtn">+ Product</button><button class="btn primary" id="addSightingBtn">+ Sighting</button></div></header><section id="dashboard" class="view active"></section><section id="products" class="view"></section><section id="stores" class="view"></section><section id="calendar" class="view"></section><section id="mapview" class="view"><div id="map" class="map"></div></section><section id="watchlist" class="view"></section><section id="history" class="view"></section><section id="settings" class="view"></section></main></div>
<dialog id="productDialog"><form id="productForm"><h2>Add product</h2><div class="form-grid"><label>Name<input name="name" required></label><label>Retail price<input name="retail" type="number" step=".01"></label><label>Category<select name="category"><option>TCG</option><option>Squishies</option><option>Beyblade</option></select></label><label>Subcategory<input name="subcategory" required></label><label class="wide">Image URL<input name="image"></label><label class="wide">Or upload image<input name="imageFile" type="file" accept="image/*"></label><label>Walmart link<input name="walmart" type="url"></label><label>Target link<input name="target" type="url"></label><label class="wide">UPC / TCIN / item number<input name="identifiers"></label><label class="wide">Notes<textarea name="notes"></textarea></label></div><div class="modal-actions"><button type="button" class="btn close">Cancel</button><button class="btn primary">Save</button></div></form></dialog>
<dialog id="sightingDialog"><form id="sightingForm"><h2>Add sighting</h2><div class="form-grid"><label>Product<select name="productId" required></select></label><label>Store<select name="storeId" required></select></label><label>Status<select name="status"><option value="in-stock">In stock</option><option value="low-stock">Low stock</option><option value="out-of-stock">Out of stock</option><option value="unknown">Unknown</option></select></label><label>Quantity<input name="quantity" type="number" min="0"></label><label>Sighting time<input name="seenAt" type="datetime-local" required></label><label>Reporter<input name="reporter" value="Deanna"></label><label>In-store location<input name="inStoreLocation"></label><label>Source<select name="source"><option>Manual sighting</option><option>Retailer website</option><option>Employee information</option><option>Community report</option></select></label><label>Pickup<select name="pickup"><option>unknown</option><option>available</option><option>unavailable</option></select></label><label>Shipping<select name="shipping"><option>unknown</option><option>available</option><option>unavailable</option></select></label><label>In-store<select name="inStore"><option>available</option><option>unavailable</option><option>unknown</option></select></label><label>Confidence<select name="confidence"><option>High</option><option>Medium</option><option>Low</option></select></label><label class="wide">Photo URL<input name="photo"></label><label class="wide">Notes<textarea name="notes"></textarea></label></div><div class="modal-actions"><button type="button" class="btn close">Cancel</button><button class="btn primary">Save</button></div></form></dialog>

<dialog id="statusDialog"><form id="statusForm"><h2>Update status</h2><input type="hidden" name="reportId"><div class="form-grid"><label>New status<select name="status"><option value="in-stock">In stock</option><option value="low-stock">Low stock</option><option value="out-of-stock">Out of stock</option><option value="unknown">Unknown</option></select></label><label>Quantity<input name="quantity" type="number" min="0" placeholder="Leave blank if unknown"></label><label>Updated by<input name="updatedBy" value="Deanna" required></label><label>Update sighting time<input name="updatedSeenAt" type="datetime-local" required></label><label class="wide">Update note<textarea name="note" placeholder="What changed or what did you find?"></textarea></label></div><div class="modal-actions"><button type="button" class="btn close">Cancel</button><button class="btn primary">Save update</button></div></form></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="js/app.js"></script></body></html>
