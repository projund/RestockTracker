<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conroe Restock Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Conroe <span>Restock</span></div>
    <nav id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="products">Products</button>
      <button data-view="stores">Stores</button>
      <button data-view="calendar">Restock Days</button>
      <button data-view="mapview">Map</button>
      <button data-view="watchlist">Watchlist</button>
      <button data-view="history">History</button>
      <button data-view="settings">Data</button>
    </nav>
  </aside>
  <div id="navBackdrop" class="nav-backdrop"></div>
  <main>
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="muted">Walmart + Target · 40 miles from 77304</div>
      </div>
      <div class="topbar-right">
        <div class="actions top-actions">
          <button class="btn" id="addProductBtn">+ Product</button>
          <button class="btn primary" id="addSightingBtn">+ Sighting</button>
        </div>
        <button id="mobileMenuBtn" class="icon-btn mobile-menu-btn" aria-label="Open menu" aria-expanded="false">☰</button>
      </div>
    </header>
    <section id="dashboard" class="view active"></section>
    <section id="products" class="view"></section>
    <section id="stores" class="view"></section>
    <section id="calendar" class="view"></section>
    <section id="mapview" class="view"><div id="map" class="map"></div></section>
    <section id="watchlist" class="view"></section>
    <section id="history" class="view"></section>
    <section id="settings" class="view"></section>
  </main>
</div>

<dialog id="productDialog">
  <form id="productForm">
    <h2>Add product</h2>
    <div class="form-grid">
      <label>Category
        <select name="category" id="productCategory">
          <option>TCG</option><option>Squishies</option><option>Beyblade</option>
        </select>
      </label>
      <label id="tcgGameWrap">Game
        <select name="game" id="tcgGame">
          <option>Pokémon</option><option>Riftbound</option><option>Disney Lorcana</option><option>Gundam</option><option>One Piece</option>
        </select>
      </label>
      <label id="setWrap">Set<input name="setName" placeholder="e.g. Destined Rivals"></label>
      <label id="brandWrap" hidden>Brand
        <select name="brand" id="squishyBrand">
          <option>NeeDoh</option><option>Squeeeze</option><option>Dumpling</option><option>Taba</option>
        </select>
      </label>
      <label id="productNameWrap"><span id="productNameLabel">Item type</span><input name="productName" required placeholder="e.g. Elite Trainer Box"></label>
      <label id="beyModelWrap" hidden>Beyblade model<input name="beyModel" placeholder="e.g. Flame Leon 3-80A"></label>
      <label id="beyTypeWrap" hidden>Product type
        <select name="beyType"><option>Starter</option><option>Booster</option><option>Multipack</option><option>Stadium set</option><option>Exclusive</option><option>Other</option></select>
      </label>
      <label>Retail price<input name="retail" type="number" min="0" step=".01"></label>
      <label class="wide">Online product image URL<input name="image" type="url" placeholder="Direct image URL from a legitimate product page"></label>
      <label class="wide">Product page source<input name="imageSource" type="url" placeholder="Page where the product image came from"></label>
      <div id="beyLinks" class="wide nested-grid" hidden>
        <label>Walmart exact product link<input name="walmart" type="url"></label>
        <label>Target exact product link<input name="target" type="url"></label>
      </div>
      <label class="wide">UPC / TCIN / item number<input name="identifiers"></label>
      <label class="wide">Notes<textarea name="notes"></textarea></label>
    </div>
    <div class="modal-actions"><button type="button" class="btn close">Cancel</button><button class="btn primary">Save</button></div>
  </form>
</dialog>

<dialog id="sightingDialog">
  <form id="sightingForm">
    <h2>Add sighting</h2>
    <div class="form-grid">
      <label>Product<select name="productId" required></select></label>
      <label>Store<select name="storeId" required></select></label>
      <label>Status<select name="status"><option value="in-stock">In stock</option><option value="low-stock">Low stock</option><option value="out-of-stock">Out of stock</option><option value="unknown">Unknown</option></select></label>
      <label>Quantity<input name="quantity" type="number" min="0" placeholder="Unknown is okay"></label>
      <label>Sighting time<input name="seenAt" type="datetime-local" required></label>
      <label>Reporter<input name="reporter" value="Deanna" required></label>
      <label>In-store location<input name="inStoreLocation" placeholder="Aisle, endcap, register area..."></label>
      <label>Source<select name="source" id="sightingSource"><option>Manual sighting</option><option>Online retailer</option><option>Employee information</option><option>Community report</option></select></label>
      <label class="online-only" hidden>Pickup<select name="pickup"><option>unknown</option><option>available</option><option>unavailable</option></select></label>
      <label class="online-only" hidden>Shipping<select name="shipping"><option>unknown</option><option>available</option><option>unavailable</option></select></label>
      <label class="wide online-only" hidden>Product link<input name="productLink" type="url" placeholder="Exact retailer product page"></label>
      <label>In-store<select name="inStore"><option>available</option><option>unavailable</option><option>unknown</option></select></label>
      <label>Confidence<select name="confidence"><option>High</option><option>Medium</option><option>Low</option></select></label>
      <label class="wide">In-store sighting photo<input name="photoFile" type="file" accept="image/*"></label>
      <label class="wide">Notes<textarea name="notes"></textarea></label>
    </div>
    <div class="modal-actions"><button type="button" class="btn close">Cancel</button><button class="btn primary">Save</button></div>
  </form>
</dialog>

<dialog id="statusDialog">
  <form id="statusForm">
    <h2>Update sighting</h2><input type="hidden" name="reportId">
    <div class="form-grid">
      <label>New status<select name="status"><option value="in-stock">In stock</option><option value="low-stock">Low stock</option><option value="out-of-stock">Out of stock</option><option value="unknown">Unknown</option></select></label>
      <label>Quantity<input name="quantity" type="number" min="0" placeholder="Leave blank if unknown"></label>
      <label>Updated by<input name="updatedBy" value="Deanna" required></label>
      <label>New sighting time<input name="updatedSeenAt" type="datetime-local" required></label>
      <label class="wide">New sighting photo<input name="photoFile" type="file" accept="image/*"></label>
      <label class="wide">Or photo URL<input name="photo" type="url"></label>
      <label class="wide">Update note<textarea name="note" placeholder="What changed or what did you find?"></textarea></label>
    </div>
    <div class="modal-actions"><button type="button" class="btn close">Cancel</button><button class="btn primary">Save update</button></div>
  </form>
</dialog>

<dialog id="detailDialog" class="detail-dialog"><div id="detailContent"></div></dialog>

<dialog id="scheduleDialog">
  <form id="scheduleForm">
    <h2 id="scheduleDialogTitle">Update restock days</h2><input type="hidden" name="scheduleId"><input type="hidden" name="storeId">
    <div class="form-grid">
      <label class="wide">Title<input name="title" required></label>
      <label>Category<select name="category"><option>All</option><option>TCG</option><option>Squishies</option><option>Beyblade</option></select></label>
      <label>Time<input name="time" placeholder="Morning, afternoon, 9 AM..."></label>
      <fieldset class="wide weekday-picker"><legend>Restock days</legend>
        <label><input type="checkbox" name="days" value="Monday">Mon</label><label><input type="checkbox" name="days" value="Tuesday">Tue</label><label><input type="checkbox" name="days" value="Wednesday">Wed</label><label><input type="checkbox" name="days" value="Thursday">Thu</label><label><input type="checkbox" name="days" value="Friday">Fri</label><label><input type="checkbox" name="days" value="Saturday">Sat</label><label><input type="checkbox" name="days" value="Sunday">Sun</label>
      </fieldset>
      <label>Updated by<input name="updatedBy" value="Deanna" required></label>
      <label>Pattern type<select name="type"><option>Observed pattern</option><option>Expected delivery</option><option>Unconfirmed</option></select></label>
      <label class="wide">Update note<textarea name="updateNote" placeholder="Why are you changing this schedule?"></textarea></label>
      <label class="wide">Schedule notes<textarea name="notes"></textarea></label>
    </div>
    <div class="modal-actions"><button type="button" class="btn close">Cancel</button><button class="btn primary">Save schedule</button></div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
